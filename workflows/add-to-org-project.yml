name: Add Issue to Org Project
on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to org project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_PROJECT_WRITE }}
          script: |
            const projectId = "P21:CyberCoyotes"; // Replace with your actual ProjectV2 node ID!
            const issueId = context.payload.issue.node_id;

            // If you don't have the ProjectV2 node ID, see help below

            await github.graphql(`
              mutation {
                addProjectV2ItemById(input: {projectId: "${projectId}", contentId: "${issueId}"}) {
                  item {
                    id
                  }
                }
              }
            `);